name: 自動產生 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: 產生 APK
        working-directory: android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --stacktrace

      - name: 整理檔名
        run: cp android/app/build/outputs/apk/debug/app-debug.apk phonelog-analyzer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: phonelog-analyzer-apk
          path: phonelog-analyzer.apk

      - name: 放到 Releases（最新版）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest phonelog-analyzer.apk \
            --title "最新版 APK" \
            --notes "每次更新程式碼後 GitHub 自動產生。下載 phonelog-analyzer.apk 直接安裝即可。（版本 ${GITHUB_SHA::7}）"

  # 在模擬器上實際跑一次，檢查會不會閃退（用 .github/test/sample.txt 這個假報告）
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phonelog-analyzer-apk
      - name: 開啟模擬器加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 在模擬器上測試
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/test/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-result
          path: test-out
      - name: 測試結果放到 Releases（test-result）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete test-result -y --cleanup-tag || true
          find test-out -type f -empty -delete
          gh release create test-result test-out/* --prerelease --title "模擬器測試結果" --notes "自動測試用，不用下載"
